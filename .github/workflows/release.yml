# Release builds the archives for a version tag, for example v0.1.0, and makes a draft release on GitHub.
# A person reads the draft. Then the person publishes it on GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Build the release archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/clawdiator-darwin-arm64.tar.gz \
            dist/release/clawdiator-darwin-amd64.tar.gz \
            dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes
