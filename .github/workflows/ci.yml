# CI tests and builds clawdiator on macOS and on Linux. The workflow "Release" also runs it before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # A fixed image gives the same Xcode and the same macOS SDK for each run.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go 1.26 is the last Go that runs on macOS 12. Read scripts/build-release.sh.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Check go.mod and go.sum
        run: go mod tidy -diff

      - name: Vet
        run: |
          go vet ./...
          CGO_ENABLED=1 go vet -tags tray ./...

      - name: Test with the race detector
        run: go test -race ./...

      # The main binary of a release has no cgo, so the tests also run without cgo.
      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...

      # Windows is not ready, but its code must compile. The release script builds the archives of Linux.
      - name: Build for Windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .

      - name: Build the release archives
        run: scripts/build-release.sh v0.0.0

  # The tests of the Linux parts run only on Linux, for example the parser of loginctl and the start of a terminal.
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Vet
        run: |
          go vet ./...
          go vet -tags tray ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...
